name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:00 AEST. A nightly run catches breakage caused by the third-party site
    # changing under us, rather than by a commit here.
    - cron: '0 18 * * *'

jobs:
  # ---------------------------------------------------------------------------
  # The API suite is the real gate. It is deterministic, it owns its own test
  # data, and it finishes in about seven seconds, so it runs on every push and
  # every pull request.
  # ---------------------------------------------------------------------------
  api:
    name: API suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The web suite drives cheapflights.com.au, a live commercial site. It runs on
  # every push as well as nightly.
  #
  # It briefly ran nightly-only, on the theory that a suite depending on a third
  # party cannot be a meaningful gate. That reasoning is sound in general, but it
  # was the wrong call here: the failure that prompted it was not environmental
  # at all. The trace showed the site's sticky header intercepting pointer events
  # on the autocomplete list — a real robustness bug in the page object, which is
  # now fixed. The suite belongs back on the gate where it can catch the next one.
  #
  # A single worker: this is someone else's production site, and concurrent
  # searches from one datacenter IP are what a rate limiter exists to stop.
  # ---------------------------------------------------------------------------
  web:
    name: Web suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=web --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The executable defect report. This job is EXPECTED TO FAIL — one failure per
  # open defect in the API — so it is marked continue-on-error and does not gate
  # anything. It exists to make the current bug count visible on every run.
  #
  # A test going green here means the API was fixed and the matching entry in
  # docs/defects.md can be closed.
  # ---------------------------------------------------------------------------
  defects:
    name: Known defects (informational — expected to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No continue-on-error on the STEP: the step must be allowed to fail so the
      # job is visibly red and the open-defect count is obvious at a glance.
      # continue-on-error on the JOB is what stops that failure gating the build.
      - name: Report open defects
        run: npx playwright test --project=defects
